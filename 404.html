<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal lost (404) — Cohen Bryant</title>
<meta name="description" content="That page could not be found on Cohen Bryant's engineering portfolio.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="backdrop" aria-hidden="true">
    <div class="backdrop-grid"></div>
    <div class="backdrop-noise"></div>
</div>

<main class="notfound">
    <div class="shell notfound-inner">
        <p class="eyebrow">
            <span class="beacon" aria-hidden="true"></span>
            Error 404 · Resource not found
        </p>

        <p class="notfound-code" aria-hidden="true">404</p>

        <h1 class="notfound-title">Signal lost.</h1>

        <p class="notfound-body">
            The page you requested isn't at this address. It may have been moved, renamed,
            or it never existed in the first place.
        </p>

        <div class="notfound-actions">
            <a class="btn btn-solid" href="/">
                Return to portfolio
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m0 0-5-5m5 5-5 5"/></svg>
            </a>
            <a class="btn btn-outline" href="/#work">View selected work</a>
        </div>
    </div>
</main>
</body>
</html>
